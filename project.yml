# XcodeGen spec: `xcodegen generate` writes WAFI.xcodeproj (the project file itself is not committed).
name: WAFI
options:
  bundleIdPrefix: com.wafi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: "11.13.0"
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "2.1.0"

targets:
  WAFI:
    type: application
    platform: iOS
    sources:
      - path: WAFI
        excludes:
          - "Resources/Fonts/*.txt"
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
      - sdk: StoreKit.framework
      - sdk: AuthenticationServices.framework
    entitlements:
      path: WAFI/WAFI.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
    info:
      path: WAFI/Info.plist
      properties:
        CFBundleDisplayName: WAFI
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIBackgroundModes: [remote-notification]
        UIAppFonts:
          - plex_arabic_regular.ttf
          - plex_arabic_medium.ttf
          - plex_arabic_semibold.ttf
          - plex_arabic_bold.ttf
        NSCameraUsageDescription: "عشان تمسح باركود المنتج وتلاقي سعره."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # where the app talks to; Account → Server address can change it at runtime
        WAFIAPIBaseURL: $(WAFI_API_BASE_URL)
        # AdMob: the real App ID replaces Google's sample one before release (see the iOS guide)
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        FirebaseAppDelegateProxyEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wafi.app
        PRODUCT_NAME: WAFI
        INFOPLIST_KEY_CFBundleDisplayName: WAFI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(WAFI_TEAM_ID)
        WAFI_TEAM_ID: ""
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: [-ObjC]
      configs:
        Debug:
          APS_ENVIRONMENT: development
          WAFI_API_BASE_URL: http://127.0.0.1:8000
        Release:
          APS_ENVIRONMENT: production
          WAFI_API_BASE_URL: https://api.example.com
    scheme:
      testTargets: [WAFITests, WAFIUITests]
      gatherCoverageData: false

  WAFITests:
    type: bundle.unit-test
    platform: iOS
    sources: [WAFITests]
    dependencies:
      - target: WAFI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wafi.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WAFI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WAFI
        BUNDLE_LOADER: $(TEST_HOST)

  WAFIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WAFIUITests]
    dependencies:
      - target: WAFI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wafi.app.uitests
        TEST_TARGET_NAME: WAFI
